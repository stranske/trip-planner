name: Cross-Repo Smoke

# Gate the planner-side cross-repo contract: run `make full-product-check`
# against a pinned Travel-Plan-Permission checkout via the local subprocess
# path that `scripts/check_full_product_verification.py` already supports.
#
# Bumping the pin: edit TPP_PINNED_REF below and open a paired PR on the
# TPP-side cross-repo-smoke job that pins the corresponding trip-planner SHA.
# See docs/CI_SYSTEM_GUIDE.md ("Cross-repo smoke gate").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CROSS_REPO_TOKEN:
        required: false

env:
  TPP_PINNED_REF: 50992156e4a1f97c1115b6c7af84a219a3b9aae7

jobs:
  cross-repo-full-product:
    name: cross-repo-full-product
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trip-planner (PR head)
        uses: actions/checkout@v7
        with:
          path: trip-planner

      - name: Checkout Travel-Plan-Permission at pinned ref
        uses: actions/checkout@v7
        with:
          repository: stranske/Travel-Plan-Permission
          ref: ${{ env.TPP_PINNED_REF }}
          path: Travel-Plan-Permission
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Log resolved pinned TPP SHA
        working-directory: Travel-Plan-Permission
        run: |
          echo "TPP_PINNED_REF=${TPP_PINNED_REF}"
          echo "TPP_RESOLVED_SHA=$(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'trip-planner/frontend/package-lock.json'

      - name: Install trip-planner backend dependencies
        working-directory: trip-planner
        run: python -m pip install -e ".[dev]"

      - name: Install actionlint 1.7.10
        env:
          ACTIONLINT_VERSION: '1.7.10'
          ARCHIVE_SHA256: f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f
          BINARY_SHA256: 98def53d7668f0f87cb2dd57addd825399ab1bc1902286944d662aa56c4e2cbe
        working-directory: ${{ runner.temp }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "$ARCHIVE_SHA256  $archive" | sha256sum --check
          mkdir -p trip-actionlint
          tar -xzf "$archive" -C trip-actionlint actionlint
          echo "$BINARY_SHA256  trip-actionlint/actionlint" | sha256sum --check
          trip-actionlint/actionlint -version
          echo "$RUNNER_TEMP/trip-actionlint" >> "$GITHUB_PATH"

      - name: Check actionlint accepts the smoke workflow and rejects an invalid copy
        working-directory: trip-planner
        env:
          TRIP_PLANNER_REQUIRE_ACTIONLINT: '1'
        run: |
          python -m pytest -v \
            tests/scripts/test_cross_repo_smoke_workflow.py::test_actionlint_rejects_invalid_workflow \
            tests/scripts/test_cross_repo_smoke_workflow.py::test_workflow_passes_actionlint

      - name: Check dev pins co-resolve with pinned TPP
        working-directory: trip-planner
        env:
          TPP_REPO_PATH: ../Travel-Plan-Permission
        run: python -m pytest tests/scripts/test_cross_repo_dev_pins.py -q

      - name: Install uv for TPP auto-start fallback
        run: python -m pip install uv

      - name: Install Travel-Plan-Permission dependencies
        working-directory: Travel-Plan-Permission
        run: |
          python -m venv .venv
          # Contract tests import both applications in this interpreter.
          # Resolve both runtime and dev dependency sets together; fail closed.
          .venv/bin/python -m pip install -e ".[dev]" -e "../trip-planner[dev]"
          .venv/bin/python -m pip check

      - name: Install trip-planner frontend dependencies
        working-directory: trip-planner
        run: npm --prefix frontend ci

      - name: Verify TPP portal handoff contract
        working-directory: trip-planner
        env:
          TPP_REPO_PATH: ../Travel-Plan-Permission
        run: ../Travel-Plan-Permission/.venv/bin/python -m pytest tests/integration/test_tpp_portal_contract.py tests/integration/test_authenticated_two_app_handoff.py -q

      - name: Run full-product-check against sibling TPP checkout
        working-directory: trip-planner
        env:
          TPP_REPO_PATH: ../Travel-Plan-Permission
          TPP_ACCESS_TOKEN: ci-cross-repo-smoke-token
          TPP_OIDC_PROVIDER: google
          LIVE_TPP: required
        run: |
          echo "Using TPP_REPO_PATH=${TPP_REPO_PATH}"
          make full-product-check

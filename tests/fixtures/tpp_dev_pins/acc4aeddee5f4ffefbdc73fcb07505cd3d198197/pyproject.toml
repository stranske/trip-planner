[project]
name = "travel-plan-permission"
version = "0.1.0"
description = "Automate and make reproducible the travel plan approval and reimbursement process"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "stranske" }]
keywords = ["travel", "expense", "workflow", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.2",
    "openpyxl>=3.1.5",
    "jinja2>=3.1.4",
    "reportlab>=4.4.10",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "cryptography",
    "ruff==0.17.2",
    "black==26.10.1",
    "mypy==2.4.0",
    "types-PyYAML>=6.0.12",
    "numpy>=1.24.0",
    "packaging>=23.0",
    "pandas>=2.0.0",
    "pyarrow>=23.0.1",
    "hypothesis>=6.0.0",
    "langgraph>=0.2.0",
    "pytest-regressions",
]
ocr = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]
orchestration = [
    "langgraph>=0.2.0",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
fill-spreadsheet = "travel_plan_permission.cli:main"
orchestration-demo = "travel_plan_permission.orchestration.example:main"
tpp-planner-token = "travel_plan_permission.planner_auth:main"
tpp-planner-service = "travel_plan_permission.http_service:main"
tpp-planner-smoke = "travel_plan_permission.planner_smoke:main"
tpp-cross-repo-smoke = "travel_plan_permission.cross_repo_smoke:main"
tpp-audit-export = "travel_plan_permission.audit:export_main"
tpp-audit-prune = "travel_plan_permission.audit:prune_main"

[build-system]
requires = []
build-backend = "tp_build_backend"
backend-path = ["tools/build_backend"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_plan_permission = [
    "config/*.yaml",
    "templates/*.html",
    "templates/*.xlsx",
    "fixtures/planner_integration/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-m",
    "not perf",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "perf: marks opt-in performance tests excluded from the default unit lane",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["travel_plan_permission"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*", "openpyxl", "openpyxl.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true

[project]
name = "trip-planner"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic==1.18.5",
    "anyio==4.14.2",
    "fastapi==0.141.1",
    "geonamescache==3.0.2",
    "jsonschema>=4.26.0,<4.27.0",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.1",
    "psycopg[binary]==3.3.4",
    "starlette==1.3.1",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.0",
]


[project.optional-dependencies]
app = []
dev = [
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "httpx==0.28.1",
    "jinja2>=3.1.4",
    "packaging==26.2",
    "PyYAML==6.0.3",
    "types-PyYAML==6.0.12.20260724",
    "pytest-httpserver==1.1.5",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "pydantic==2.13.4",
